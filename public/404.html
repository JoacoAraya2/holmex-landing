<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada · HOLMEX</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="theme-color" content="#070b14" />
    <!-- Página que Cloudflare devuelve con estado 404 para rutas inexistentes (wrangler.jsonc › not_found_handling). -->
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: #070b14;
        color: #f8fafc;
        font: 16px/1.6 "Segoe UI", system-ui, sans-serif;
      }
      main { max-width: 32rem; }
      .eyebrow {
        margin: 0;
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #38bdf8;
      }
      h1 { margin: 12px 0 0; font-size: 2rem; line-height: 1.15; }
      p { color: #94a3b8; }
      a.boton {
        display: inline-block;
        margin-top: 8px;
        padding: 0.8rem 1.25rem;
        border-radius: 6px;
        background: #2563eb;
        color: #f8fafc;
        font-weight: 600;
        text-decoration: none;
      }
      a.boton:hover { background: #1d4ed8; }
      a:focus-visible { outline: 2px solid #00d2ff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>Esta página no existe</h1>
      <p>La dirección puede estar mal escrita o la página ya no está disponible.</p>
      <a class="boton" href="/">Volver a HOLMEX</a>
    </main>
  </body>
</html>
