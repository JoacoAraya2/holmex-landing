[package]
name = "holmex-demo-motor"
version = "0.1.0"
edition = "2021"
publish = false
description = "Motor de Holmex compilado a WebAssembly para la demo web (solo corre en el servidor)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.39.4", features = ["serialize"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
